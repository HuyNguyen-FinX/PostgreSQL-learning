# =============================================================================
#  postgresql.conf — cấu hình dành cho MÔI TRƯỜNG HỌC
# =============================================================================
#  File này KHÔNG phải cấu hình production. Nó được điều chỉnh để:
#    1. Ghi log thật nhiều, để nhìn thấy những gì production thường giấu đi.
#    2. Đặt work_mem thấp có chủ đích, để dễ tái hiện hiện tượng spill to disk.
#    3. Bật sẵn mọi extension chẩn đoán dùng xuyên suốt giáo trình.
#  Phần giải thích từng nhóm tham số nằm ở 00-moi-truong/README.md
# =============================================================================

# ── Kết nối ──────────────────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100

# ── Bộ nhớ ───────────────────────────────────────────────────────────────────
shared_buffers = 256MB
work_mem = 4MB                   # cố tình để thấp, xem README
maintenance_work_mem = 128MB
effective_cache_size = 2GB

# ── Cost model (giả định storage là SSD) ─────────────────────────────────────
seq_page_cost = 1.0
random_page_cost = 1.1
effective_io_concurrency = 200

# ── WAL ──────────────────────────────────────────────────────────────────────
wal_level = logical              # đặt sẵn cho Phần 10, tránh phải restart sau
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
max_wal_senders = 10
max_replication_slots = 10

# ── Extension chẩn đoán ──────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements,auto_explain'
compute_query_id = on
pg_stat_statements.max = 10000
pg_stat_statements.track = all

auto_explain.log_min_duration = '200ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on
auto_explain.log_format = text

# ── Thống kê ─────────────────────────────────────────────────────────────────
track_io_timing = on
track_functions = all
track_activity_query_size = 4096

# ── Logging ──────────────────────────────────────────────────────────────────
logging_collector = off          # để log đi thẳng ra `docker compose logs`
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = '200ms'
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0               # ghi lại MỌI temp file, dù nhỏ
log_autovacuum_min_duration = 0  # ghi lại MỌI lần autovacuum chạy

# ── Lock ─────────────────────────────────────────────────────────────────────
deadlock_timeout = '1s'

# ── Autovacuum ───────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_naptime = '10s'       # mặc định 1min, rút ngắn để lab đỡ phải chờ

# ── Locale / timezone ────────────────────────────────────────────────────────
timezone = 'Asia/Ho_Chi_Minh'
lc_messages = 'C'                # giữ thông báo lỗi bằng tiếng Anh để dễ tra cứu
